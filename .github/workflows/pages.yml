name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate field-update content
        run: npm run validate:content
      - name: Validate Research OS content
        run: npm run validate:research-os
      - name: Lint
        run: npm run lint
      - name: Build GitHub Pages static export
        run: npm run export:pages
        env:
          GITHUB_ACTIONS: "true"
      - name: Test exported route content
        run: npm run test:pages-content
      - name: Test static export
        run: npm run test:static-export
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
